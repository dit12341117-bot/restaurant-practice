<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ditto">
    <meta name="description" content="Kito Restaurant - A place for delicious food and great dining experience.">
    <title>
        Kito Restaurant
    </title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="top">
        <h1>Welcome to The KITO Restaurant</h1>
        <nav>
            <ul>
                <li><a href="index.html#about"><abbr title="AboutKito Restaurant">About</abbr></a></li>
                <li><a href="#menu">Our Menu</a></li>
                <li><a href="index.html#timings">Store Hours</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>
        <figure>
            <img src="images/Kitologo.png" alt="Kito Restaurant" style="width: 50%; height: 50%;">
        </figure>
        <figcaption>
            Our logo represents the essence of KITO, combining tradition and innovation in every dish we serve.
        </figcaption>
    </header>
    <hr>
    <main>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>
                We would love to hear from you! Please reach out to us with any questions, feedback, or inquiries.
            </p>
            <fieldset style="height: 100%; width: 50%;">
                <legend>Contact Form</legend>
                <form>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required><br><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" required></textarea><br><br>
                    <input type="submit" value="Submit">
                </form>
            </fieldset>
        </section>
    </main>
    <a href="#top" class="back-to-top">Back to Top</a>
    <hr>
    <footer>
        <p>&copy; 2026 KITO Restaurant. All rights reserved.</p>
    </footer>
</body>

</html>
